name: Shared database validation
on:
  push:
    branches: [codex/shared-database-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: spark_ha_test
          POSTGRES_USER: spark_test
          POSTGRES_PASSWORD: test-only-shared-db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spark_test -d spark_ha_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SPARK_TEST_POSTGRES_URL: postgresql+psycopg://spark_test:test-only-shared-db@127.0.0.1:5432/spark_ha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies and test tools
        run: python -m pip install -r requirements.txt -r requirements-console.txt pytest
      - name: Validate migrations, coordination and existing behavior
        run: >-
          python -m pytest -q
          tests/console/test_shared_database.py
          tests/console/test_config_db.py
          tests/console/test_scheduler_worker.py
          tests/console/test_auth_worker.py
          tests/console/test_scan_sessions.py
          tests/console/test_batch_recovery.py
          tests/console/test_notifier.py
          tests/console/test_notifications.py
          tests/console/test_browser_runtime.py
      - name: Validate deployment configuration
        env:
          SPARK_RELEASE_IMAGE: spark-shared:${{ github.sha }}
        run: |
          docker compose -f deploy/shared-db/compose.database.yml config --quiet
          docker compose -f deploy/shared-db/compose.apps.yml config --no-env-resolution --quiet
      - name: Build a traceable Linux application image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -f Dockerfile.console -t "spark-shared:$GITHUB_SHA" .
      - name: Verify container imports and bundled browser
        run: |
          docker run --rm "spark-shared:$GITHUB_SHA" python -c 'from spark_console.web.app import create_app; from spark_console.worker import Worker; from spark_console.auth_worker import AuthWorker; from spark_console.notifier import Notifier; from spark_console.migrate_postgres import migrate; from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop(); print("Linux runtime verified")'
