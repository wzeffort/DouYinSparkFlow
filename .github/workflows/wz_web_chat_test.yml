name: DouYin API Hosted WZ Manual Test

on:
  workflow_dispatch:

jobs:
  run-api-test:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    environment: user-data
    steps:
      - name: Check out upstream API branch
        uses: actions/checkout@v4
        with:
          repository: 2061360308/DouYinSparkFlow
          ref: api

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Send one WZ API test message
        env:
          WZ_SESSIONID: ${{ secrets.API_TEST_WZ_SESSIONID }}
        run: >-
          java -jar res/kol_dy_msg-1.0.4-SNAPSHOT-private-message-cli.jar
          --sessionId "$WZ_SESSIONID"
          --userId "96192738929"
          --type text
          --conversationId "0:1:93544891174:96192738929"
          --conversationShortId "7069013403037090308"
          --content "GitHub API直连测试-${{ github.run_id }}"
          --output json
          --quiet true
