name: spark-shared-db
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: spark
      POSTGRES_USER: spark
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./secrets/db-password:/run/secrets/db-password:ro
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U spark -d spark"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  postgres-data:
