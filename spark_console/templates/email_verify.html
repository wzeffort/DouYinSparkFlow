{% extends "base.html" %}{% block content %}<header class="page-header"><div><p class="eyebrow">EMAIL VERIFY</p><h1>验证邮箱</h1><p>输入邮件中的 6 位验证码。</p></div></header><section class="panel">{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" required></label><button type="submit">完成验证</button></form></section>{% endblock %}
