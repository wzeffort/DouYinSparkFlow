{% extends "base.html" %}{% block content %}
<section class="auth-card reset-auth-card">
  <div class="security-mark" aria-hidden="true">?</div>
  <h1>找回密码</h1>
  <p class="muted">输入已验证的邮箱，我们会发送 6 位验证码。</p>
  <div class="reset-privacy-note">无论邮箱是否存在，页面都会显示相同提示，以保护账号信息。</div>
  <form method="post" action="/forgot-password" class="stack"><label>邮箱地址<input type="email" name="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required></label><button type="submit">{% if verification_id %}重新发送验证码{% else %}发送验证码{% endif %}</button></form>
  {% if verification_id %}
    <div class="inline-verification reset-inline-verification" id="password-reset-verification" role="region" aria-labelledby="password-reset-title">
      <div class="inline-verification-heading"><span class="email-state-dot"></span><div><strong id="password-reset-title">验证码已发送</strong><small>如果邮箱已绑定，邮件会在几分钟内送达</small></div></div>
      {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/forgot-password/verify/{{ verification_id }}" class="stack">
        <label>6 位验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="输入邮件验证码" required autofocus></label>
        <label>新密码<input type="password" name="new_password" autocomplete="new-password" minlength="12" required><small class="muted">至少 12 位，并同时包含字母和数字</small></label>
        <label>确认新密码<input type="password" name="password_confirmation" autocomplete="new-password" minlength="12" required></label>
        <button type="submit">更新密码</button>
      </form>
    </div>
  {% endif %}
  <p class="auth-link"><a href="/login">返回登录</a></p>
</section>
{% endblock %}
