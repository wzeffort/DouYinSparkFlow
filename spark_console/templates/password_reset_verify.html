{% extends "base.html" %}{% block content %}
<section class="auth-card reset-auth-card">
  <div class="security-mark" aria-hidden="true">⌁</div>
  <h1>设置新密码</h1>
  <p class="muted">如果邮箱已绑定，验证码会在几分钟内送达。</p>
  {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <label>6 位验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" required></label>
    <label>新密码<input type="password" name="new_password" autocomplete="new-password" minlength="12" required><small class="muted">至少 12 位，并同时包含字母和数字</small></label>
    <label>确认新密码<input type="password" name="password_confirmation" autocomplete="new-password" minlength="12" required></label>
    <button type="submit">更新密码</button>
  </form>
  <p class="auth-link"><a href="/forgot-password">重新发送</a> · <a href="/login">返回登录</a></p>
</section>
{% endblock %}
